name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Tag and Push Images
        run: |
          docker pull docker.elastic.co/elasticsearch/elasticsearch:8.11.1
          docker tag docker.elastic.co/elasticsearch/elasticsearch:8.11.1 ${{ secrets.DOCKER_USERNAME }}/citycare-es:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/citycare-es:latest
          
          docker pull docker.elastic.co/beats/filebeat:8.11.1
          docker tag docker.elastic.co/beats/filebeat:8.11.1 ${{ secrets.DOCKER_USERNAME }}/citycare-filebeat:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/citycare-filebeat:latest
          
          docker pull grafana/grafana:latest
          docker tag grafana/grafana:latest ${{ secrets.DOCKER_USERNAME }}/citycare-grafana:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/citycare-grafana:latest
